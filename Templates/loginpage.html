<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Based Flat Security</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #3b82f6;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            overflow: hidden; /* No page scroll */
            background-color: var(--bg-light);
        }

        /* Left Side: Project Visuals */
        .left-side {
            flex: 1.5;
            position: relative;
            /* Updated image to a Modern Smart Building Entrance theme */
            background: linear-gradient(rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.6)), 
                        url('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&q=80&w=1200');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: white;
        }

        .hero-text {
            max-width: 500px;
            z-index: 2;
        }

        .hero-text h1 {
            font-size: 3rem;
            line-height: 1.1;
            margin-bottom: 20px;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.5);
        }

        .hero-text p {
            font-size: 1.1rem;
            opacity: 0.9;
            border-left: 4px solid var(--accent);
            padding-left: 20px;
            line-height: 1.6;
        }

        /* Right Side: Login Items */
        .right-side {
            flex: 1;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.05);
        }

        .login-box {
            width: 100%;
            max-width: 360px;
        }

        .login-box h2 {
            font-size: 1.75rem;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .login-box span {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: block;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-dark);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: -10px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background-color: var(--accent);
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="left-side">
        <div class="hero-text">
            <h1>AI Based Flat Security</h1>
            <p>A smart, efficient security solution utilizing camera-based surveillance and AI face recognition to ensure unauthorized visitors are detected in real-time.</p>
        </div>
    </div>

    <div class="right-side">
        <div class="login-box">
            <h2>System Login</h2>
            <span>Enter your credentials to access the terminal</span>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <a href="#" class="forgot-link">Forgot Password?</a>

                <button type="submit" class="login-btn">Secure Login</button>
            </form>

            <div class="footer">
                <span>System Status: ONLINE</span>
                <span>Security v1.0.2</span>
            </div>
        </div>
    </div>

</body>
</html>
