<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Camera | Admin Portal</title>
    <style>
        :root {
            --primary: #0A2357; /* Matches your FlatGuard Navy */
            --primary-hover: #1d4ed8;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        .header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 { font-size: 1.2rem; color: var(--text-main); display: flex; align-items: center; gap: 12px; }

        .form-body { padding: 25px; display: flex; flex-direction: column; gap: 20px; }

        .form-group { display: flex; flex-direction: column; gap: 8px; }

        label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(10, 35, 87, 0.1);
        }

        .footer {
            padding: 20px 25px;
            background: #f8fafc;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            border-radius: 0 0 12px 12px;
        }

        .send-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .send-btn:hover { background-color: #162e64; transform: translateY(-1px); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📷 Register New Camera</h1>
        </div>

        <form action="/myapp/add_camera_POST/" method="post">
            {% csrf_token %}
            <div class="form-body">
                <div class="form-group">
                    <label for="camera_no">Camera ID / Number</label>
                    <input type="number" id="camera_no" name="camera_no" placeholder="e.g. 101" required>
                </div>

                <div class="form-group">
                    <label for="location">Installation Location</label>
                    <input type="text" id="location" name="location" placeholder="e.g. Main Gate / Parking A" required>
                </div>
            </div>

            <div class="footer">
                <button type="submit" class="send-btn">Add Camera</button>
            </div>
        </form>
    </div>

</body>
</html>
