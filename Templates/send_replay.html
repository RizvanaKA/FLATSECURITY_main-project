<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Reply | Security Admin</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Prevents page scrolling */
        }

        .reply-container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 1.2rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-body {
            padding: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        textarea {
            width: 100%;
            height: 200px; /* Fixed height to avoid scrolling */
            padding: 15px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
            resize: none; /* Prevents user from dragging to resize */
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fafafa;
        }

        textarea:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .footer {
            padding: 20px 25px;
            background: #f8fafc;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        .send-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .send-btn:hover {
            background-color: var(--primary-hover);
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        .hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="reply-container">
        <div class="header">
            <h1>💬 Official Reply Portal</h1>
        </div>

        <form id="replyForm" action="/myapp/send_replay_POST/" method="post">
            <div class="form-body">
                <div class="form-group">
                    <label for="replyText">Compose Message</label>
                    <textarea 
                        id="replyText" 
                        name="reply" 
                        placeholder="Type your official response here..." 
                        required></textarea>
                    <p class="hint">Your reply will be sent directly to the user's dashboard.</p>
                </div>
            </div>

            <div class="footer">
                <button type="submit" class="send-btn">Send Reply</button>
            </div>
        </form>
    </div>

</body>
</html>
