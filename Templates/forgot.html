<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Flat Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --navy: #0A2357;
            --bg-slate: #F4F7FA;
            --accent: #E8EDF5;
        }

        body {
            background-color: var(--bg-slate);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .forgot-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(10, 35, 87, 0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: var(--accent);
            color: var(--navy);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }

        .step-title {
            color: var(--navy);
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .step-desc {
            color: #6c757d;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-control {
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1.5px solid #eee;
            background-color: #f8f9fa;
        }

        .form-control:focus {
            border-color: var(--navy);
            box-shadow: none;
            background-color: #fff;
        }

        .btn-primary {
            background-color: var(--navy);
            border: none;
            padding: 0.8rem;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0d2c6e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(10, 35, 87, 0.2);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-top: 1.5rem;
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .back-link:hover {
            color: var(--navy);
        }

        /* OTP Input Styling */
        .otp-input {
            letter-spacing: 0.5rem;
            font-weight: bold;
            font-size: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="forgot-card">
    <div class="icon-circle">
        <i class="bi bi-shield-lock"></i>
    </div>

    <h3 class="step-title">Reset Password</h3>
    <p class="step-desc">Enter your email and we'll send you an OTP to reset your account security.</p>

    <form action="/myapp/forgotPassword_otp/" method="POST">
        {% csrf_token %}
        <div class="mb-4 text-start">
            <label class="form-label fw-bold small text-muted">EMAIL ADDRESS</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="bi bi-envelope"></i></span>
                <input type="email" name="email" class="form-control border-0" placeholder="name@flat.com" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">SEND VERIFICATION CODE</button>
    </form>

    <a href="/myapp/login/" class="back-link">
        <i class="bi bi-arrow-left me-2"></i> Back to Login
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
