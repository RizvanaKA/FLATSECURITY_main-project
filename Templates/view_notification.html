<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Notifications | System Admin</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text-dark: #0f172a;
            --text-light: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            height: 85vh;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .header {
            padding: 24px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.3rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- New Header Action Styles --- */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .add-btn {
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .add-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 12px -1px rgba(37, 99, 235, 0.3);
        }

        .add-btn svg {
            width: 18px;
            height: 18px;
        }

        /* --- Table Design --- */
        .table-area {
            flex: 1;
            padding: 10px 25px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        thead th {
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 10;
            text-align: left;
            padding: 15px 12px;
            border-bottom: 2px solid var(--border);
            color: var(--text-light);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        td {
            padding: 16px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            color: var(--text-dark);
        }

        .message-cell {
            max-width: 350px;
            color: var(--text-light);
            font-style: italic;
        }

        .action-links a {
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            margin-right: 15px;
            transition: 0.2s;
        }

        .edit-link { color: var(--primary); }
        .delete-link { color: var(--danger); }

        .action-links a:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        .footer {
            padding: 15px 30px;
            background: #f8fafc;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-light);
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🔔 System Notifications</h1>

            <div class="header-actions">
                <div style="font-size: 0.85rem; color: var(--text-light);">
                    Total Sent: <b>12</b>
                </div>
                <a href="/myapp/add_notification/" class="add-btn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Create New
                </a>
                </div>
        </div>

        <div class="table-area">
            <table>
                <thead>
                    <tr>
                        <th style="width: 80px;">S.No</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Manage Message</th>
                        <th>Action</th>
                    </tr>
                  {% for i in data %}


                    <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ i.date }}</td>
                    <td>{{ i.time }}</td>
                    <td>{{ i.message}}</td>
                    <td class="action-links">
                        <a href="/myapp/edit_notification/{{ i.id }}" class="edit-link">Edit</a>
                        <a href="/myapp/delete_notification/{{ i.id }}" class="delete-link">Delete</a>
                    </td>
                     </tr>


            {% endfor %}


</thead>
                </tbody>
            </table>
        </div>

        <div class="footer">
            Showing all active broadcasts for the current week.
        </div>
    </div>

    <script>
        function confirmDelete(el) {
            if (confirm("Are you sure you want to delete this notification?")) {
                const row = el.closest('tr');
                row.style.opacity = '0.3';
                setTimeout(() => {
                    row.remove();
                    alert("Notification deleted successfully.");
                }, 300);
            }
        }
    </script>

</body>
</html>
