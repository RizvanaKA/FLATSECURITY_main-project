<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Management | Secure Admin</title>

<style>
:root {
    --primary: #2563eb;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --border: #e2e8f0;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: var(--bg);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.main-card {
    width: 95%;
    max-width: 1000px;
    height: 90vh;
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 25px rgba(0,0,0,.1);
    display: flex;
    flex-direction: column;
}

.header {
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
}

form {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 350px;
}

.details-section {
    padding: 30px 40px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    border-right: 1px solid var(--border);
}

.side-section {
    padding: 30px;
    background: #f1f5f9;
}

label {
    font-size: .85rem;
    font-weight: 600;
    color: #64748b;
}

input {
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
}

.gender-container {
    display: flex;
    gap: 10px;
}

.gender-btn {
    flex: 1;
    padding: 10px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
}

.gender-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

.photo-box {
    height: 250px;
    border: 2px dashed #cbd5e1;
    border-radius: 8px;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

#preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 6px;
}

.footer {
    padding: 20px 40px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
}

.add-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="main-card">
<div class="header">
    <h1>Edit Staff</h1>
</div>

<form id="staffForm" action="/myapp/edit_staff_POST/" method="post" enctype="multipart/form-data">
     {% csrf_token %}
<div class="details-section">

    <label>Full Name</label>
    <input type="text" name="name" value="{{ data.name }}" required>

    <label>Email</label>
    <input type="email" name="email" value="{{ data.email }}" required>

    <label>Phone</label>
    <input type="tel" name="phone_number" value="{{ data.phone }}">

    <label>Gender</label>
    <div class="gender-container">
        <button type="button" class="gender-btn" data-value="Male">Male</button>
        <button type="button" class="gender-btn" data-value="Female">Female</button>
        <button type="button" class="gender-btn" data-value="Other">Other</button>
    </div>

    <!-- IMPORTANT -->
    <input type="hidden" id="genderInput" name="gender" value="{{ data.gender|default:'' }}">

</div>

<div class="side-section">
    <label>Profile Photo</label>

    <div class="photo-box" onclick="document.getElementById('fileInput').click()">
        <img id="preview" src="{{ data.photo.url }}" alt="Photo">
    </div>

    <input type="file" id="fileInput" name="photo" value="{{ data.photo}}"hidden accept="image/*" onchange="previewImage(this)">
</div>
</form>

<div class="footer">
    <button type="submit" form="staffForm" class="add-btn">Edit Security Staff</button>
</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const buttons = document.querySelectorAll(".gender-btn");
    const genderInput = document.getElementById("genderInput");

    const savedGender = genderInput.value.trim().toLowerCase();

    buttons.forEach(btn => {
        const btnValue = btn.dataset.value.toLowerCase();

        if (btnValue === savedGender) {
            btn.classList.add("active");
        }

        btn.addEventListener("click", () => {
            buttons.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            genderInput.value = btn.dataset.value;
        });
    });
});

function previewImage(input) {
    const preview = document.getElementById("preview");
    const file = input.files[0];

    if (file) {
        const reader = new FileReader();
        reader.onload = e => preview.src = e.target.result;
        reader.readAsDataURL(file);
    }
}
</script>

</body>
</html>
