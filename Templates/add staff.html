<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management | Secure Admin</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Removes page scroll */
        }

        .main-card {
            background: var(--card);
            width: 95%;
            max-width: 1000px;
            height: 90vh; /* Fits within viewport */
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { font-size: 1.5rem; color: #0f172a; }

        form {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 350px; /* Side option for photo */
            gap: 2px;
            overflow: hidden;
        }

        /* Input Sections */
        .details-section {
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 1px solid var(--border);
        }

        .side-section {
            padding: 30px;
            background: #f1f5f9;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
        }

        input {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.2s;
        }

        input:focus { border-color: var(--primary); }

        /* Gender Buttons */
        .gender-container {
            display: flex;
            gap: 10px;
        }

        .gender-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .gender-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Photo Upload Side Box */
        .photo-box {
            flex: 1;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            cursor: pointer;
            text-align: center;
            padding: 20px;
            transition: 0.3s;
        }

        .photo-box:hover { border-color: var(--primary); background: #eff6ff; }
        
        #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 6px;
        }

        .footer {
            padding: 20px 40px;
            background: white;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
        }

        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }

        .add-btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header">
        <h1>Add New Security Staff</h1>
        <span style="color: #64748b; font-size: 0.9rem;">ID: #AUTO-GEN</span>
    </div>

    <form id="staffForm">
        <div class="details-section">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="e.g. Michael Scott" required>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="m.scott@company.com" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="+1 234 567 890">
                </div>
            </div>

            <div class="form-group">
                <label>Gender Selection</label>
                <div class="gender-container">
                    <button type="button" class="gender-btn" onclick="setGender(this, 'Male')">Male</button>
                    <button type="button" class="gender-btn" onclick="setGender(this, 'Female')">Female</button>
                    <button type="button" class="gender-btn" onclick="setGender(this, 'Other')">Other</button>
                </div>
                <input type="hidden" id="genderInput" name="gender">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>System Username</label>
                    <input type="text" placeholder="username123">
                </div>
                <div class="form-group">
                    <label>Access Password</label>
                    <input type="password" placeholder="••••••••">
                </div>
            </div>
        </div>

        <div class="side-section">
            <label>Profile Photograph</label>
            <div class="photo-box" onclick="document.getElementById('fileInput').click()">
                <div id="uploadPlaceholder">
                    <p style="font-size: 2rem;">📷</p>
                    <p style="font-size: 0.8rem; margin-top: 10px; color: #64748b;">Click to browse laptop files</p>
                </div>
                <img id="preview" alt="Staff Preview">
            </div>
            <input type="file" id="fileInput" hidden accept="image/*" onchange="previewImage(this)">
            
            <p style="font-size: 0.75rem; color: #94a3b8; text-align: center;">
                Supported formats: JPG, PNG. Max size: 2MB.
            </p>
        </div>
    </form>

    <div class="footer">
        <button type="submit" form="staffForm" class="add-btn">Add Security Staff</button>
    </div>
</div>

<script>
    // Handle Gender Button Toggles
    function setGender(btn, value) {
        document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('genderInput').value = value;
    }

    // Handle Image Browsing/Preview
    function previewImage(input) {
        const preview = document.getElementById('preview');
        const placeholder = document.getElementById('uploadPlaceholder');
        
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                placeholder.style.display = 'none';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>

</body>
</html>
